[package]
name = "ftlog"
version = "0.2.18"
edition = "2021"
rust-version = "1.75"
authors = [ "Non-convex Tech" ]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nonconvextech/ftlog"
documentation = "https://docs.rs/ftlog"
description = """
An asynchronous logging library for high performance
"""
categories = [ "development-tools::debugging" ]
keywords = [ "logging" ]
exclude = [
  ".standard-version",
  ".versionrc",
  ".github",
  "semver-checks"
]

[package.metadata.docs.rs]
all-features = true

[features]
default = [ "random_drop" ]
tsc = [ "minstant", "once_cell" ]
random_drop = [ "fastrand" ]
gzip = [ "dep:flate2" ]

[dependencies]
crossbeam-channel = "0.5.0"
foldhash = "0.2"
arc-swap = "1"
typed-builder = "0.23"

  [dependencies.fastrand]
  version = "2"
  optional = true

  [dependencies.flate2]
  version = "1"
  optional = true

  [dependencies.time]
  version = "0.3"
  features = [ "local-offset", "formatting" ]

  [dependencies.minstant]
  version = "0.1"
  optional = true

  [dependencies.once_cell]
  version = "1"
  optional = true

  [dependencies.log]
  version = "0.4"
  features = [ "std", "kv" ]

[target."cfg(target_family = \"unix\")".dependencies.tz-rs]
version = "0.7.0"
